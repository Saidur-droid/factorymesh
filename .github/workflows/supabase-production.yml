name: Supabase Production

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          missing=()
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || missing+=("SUPABASE_ACCESS_TOKEN")
          [ -n "${SUPABASE_DB_PASSWORD:-}" ] || missing+=("SUPABASE_DB_PASSWORD")
          [ -n "${SUPABASE_PROJECT_ID:-}" ] || missing+=("SUPABASE_PROJECT_ID")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::Supabase production deployment skipped. Missing repository secrets: ${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.credentials.outputs.ready == 'true'
        with:
          version: latest

      - name: Link production project
        if: steps.credentials.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending migrations
        if: steps.credentials.outputs.ready == 'true'
        run: supabase db push --dry-run

      - name: Apply pending migrations
        if: steps.credentials.outputs.ready == 'true'
        run: supabase --yes db push

      - name: Verify migration history
        if: steps.credentials.outputs.ready == 'true'
        run: supabase migration list
