name: Production Launch Verification

on:
  push:
    branches:
      - main
      - verify-production-launch-gates
    paths:
      - "production-e2e/**"
      - "playwright.production.config.js"
      - ".github/workflows/production-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-launch-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRODUCTION_BASE_URL: https://factorymesh.vercel.app
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve scoped production test credentials
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_ID:-}" ]; then
            echo "::error::Required Supabase repository secrets are missing"
            exit 1
          fi

          keys="$(curl -fsS             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys?reveal=true")"

          service_key="$(printf '%s' "$keys" | jq -r '([.[] | select(.name == "service_role")][0].api_key // [.[] | select(.type == "secret")][0].api_key // empty)')"
          publishable_key="$(printf '%s' "$keys" | jq -r '([.[] | select(.type == "publishable")][0].api_key // [.[] | select(.name == "anon")][0].api_key // empty)')"

          if [ -z "$service_key" ] || [ -z "$publishable_key" ]; then
            echo "::error::Unable to resolve required Supabase API keys"
            exit 1
          fi

          echo "::add-mask::$service_key"
          echo "::add-mask::$publishable_key"
          echo "SUPABASE_TEST_URL=https://$SUPABASE_PROJECT_ID.supabase.co" >> "$GITHUB_ENV"
          echo "SUPABASE_TEST_SERVICE_KEY=$service_key" >> "$GITHUB_ENV"
          echo "SUPABASE_TEST_PUBLISHABLE_KEY=$publishable_key" >> "$GITHUB_ENV"

      - name: Verify production Auth redirect allow-list
        id: auth_redirect
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const { createClient } = require('@supabase/supabase-js')
          const crypto = require('node:crypto')

          const supabase = createClient(
            process.env.SUPABASE_TEST_URL,
            process.env.SUPABASE_TEST_SERVICE_KEY,
            { auth: { autoRefreshToken: false, persistSession: false } }
          )

          const expected = process.env.PRODUCTION_BASE_URL + '/auth/callback?next=/onboarding'
          const email = 'factorymesh.auth.redirect.' + Date.now() + '.' +
            crypto.randomBytes(3).toString('hex') + '@example.com'
          const password = 'Fm!' + crypto.randomUUID() + '9aA'

          ;(async () => {
            let userId
            try {
              const { data, error } = await supabase.auth.admin.generateLink({
                type: 'signup',
                email,
                password,
                options: { redirectTo: expected },
              })
              if (error) throw error

              userId = data?.user?.id
              const actual = data?.properties?.redirectTo || data?.properties?.redirect_to
              console.log('Requested Auth redirect:', expected)
              console.log('Resolved Auth redirect:', actual || '(missing)')

              if (actual !== expected) {
                console.error(
                  'Production Auth redirect is not allow-listed. Expected ' +
                  expected + ' but Supabase resolved ' + String(actual)
                )
                require('node:fs').appendFileSync(
                  process.env.GITHUB_OUTPUT,
                  'status=misconfigured\n'
                )
              } else {
                require('node:fs').appendFileSync(
                  process.env.GITHUB_OUTPUT,
                  'status=verified\n'
                )
              }
            } finally {
              if (userId) {
                const { error: cleanupError } = await supabase.auth.admin.deleteUser(userId)
                if (cleanupError) throw cleanupError
              }
            }
          })().catch((error) => {
            console.error(error.message || error)
            process.exit(1)
          })
          NODE

      - name: Report production readiness response
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          code="$(curl -sS -o "$body_file" -w "%{http_code}" "$PRODUCTION_BASE_URL/api/readiness" || true)"
          body="$(cat "$body_file" || true)"
          rm -f "$body_file"
          echo "Production readiness HTTP $code: $body"

      - name: Run real production launch verification
        run: npx playwright test -c playwright.production.config.js

      - name: Enforce production Auth redirect gate
        if: always()
        env:
          AUTH_REDIRECT_STATUS: ${{ steps.auth_redirect.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Production Auth redirect status: ${AUTH_REDIRECT_STATUS:-unknown}"
          [ "${AUTH_REDIRECT_STATUS:-unknown}" = "verified" ] || {
            echo "::error::Production Auth redirect allow-list is not correctly configured."
            exit 1
          }
