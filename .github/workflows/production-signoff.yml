name: Production Signoff

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-signoff.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-signoff
  cancel-in-progress: false

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      PRODUCTION_BASE_URL: https://factorymesh.vercel.app
    steps:
      - name: Check credentials
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "::error::SUPABASE_ACCESS_TOKEN is missing"; exit 1; }
          [ -n "${SUPABASE_PROJECT_ID:-}" ] || { echo "::error::SUPABASE_PROJECT_ID is missing"; exit 1; }

      - name: Configure production Auth URLs
        shell: bash
        run: |
          set -euo pipefail

          auth_url="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth"
          desired_site="$PRODUCTION_BASE_URL"
          desired_allow="$PRODUCTION_BASE_URL/auth/callback,$PRODUCTION_BASE_URL/auth/confirm"

          current="$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$auth_url")"
          current_site="$(printf '%s' "$current" | jq -r '.site_url // ""')"
          current_allow="$(printf '%s' "$current" | jq -r '.uri_allow_list // ""')"

          echo "Current Site URL: $current_site"
          echo "Current redirect allow-list: $current_allow"

          if [ "$current_site" != "$desired_site" ] || [ "$current_allow" != "$desired_allow" ]; then
            body="$(jq -n               --arg site "$desired_site"               --arg allow "$desired_allow"               '{site_url:$site, uri_allow_list:$allow}')"

            curl -fsS -X PATCH               -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"               -H "Content-Type: application/json"               --data "$body"               "$auth_url" >/dev/null

            echo "Production Auth URLs updated."
          else
            echo "Production Auth URLs already correct."
          fi

          verified="$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$auth_url")"
          site="$(printf '%s' "$verified" | jq -r '.site_url // ""')"
          allow="$(printf '%s' "$verified" | jq -r '.uri_allow_list // ""')"

          [ "$site" = "$desired_site" ] || { echo "::error::Site URL verification failed: $site"; exit 1; }
          [ "$allow" = "$desired_allow" ] || { echo "::error::Redirect allow-list verification failed: $allow"; exit 1; }

          echo "Verified Site URL: $site"
          echo "Verified redirect allow-list: $allow"

      - name: Review Supabase security advisors
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/advisors/security"             > security-advisors.json

          count="$(jq '.lints | length' security-advisors.json)"
          errors="$(jq '[.lints[]? | select((.level // "") == "ERROR")] | length' security-advisors.json)"
          warns="$(jq '[.lints[]? | select((.level // "") == "WARN")] | length' security-advisors.json)"
          infos="$(jq '[.lints[]? | select((.level // "") == "INFO")] | length' security-advisors.json)"

          echo "Security advisors: total=$count error=$errors warn=$warns info=$infos"
          jq -r '.lints[]? | "[\(.level // "UNKNOWN")] \(.name // "unnamed"): \(.title // .description // "no title")"' security-advisors.json

          if [ "$errors" -gt 0 ]; then
            echo "::error::Supabase security advisors contain $errors ERROR finding(s)."
            exit 1
          fi

      - name: Review Supabase performance advisors
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/advisors/performance"             > performance-advisors.json

          count="$(jq '.lints | length' performance-advisors.json)"
          errors="$(jq '[.lints[]? | select((.level // "") == "ERROR")] | length' performance-advisors.json)"
          warns="$(jq '[.lints[]? | select((.level // "") == "WARN")] | length' performance-advisors.json)"
          infos="$(jq '[.lints[]? | select((.level // "") == "INFO")] | length' performance-advisors.json)"

          echo "Performance advisors: total=$count error=$errors warn=$warns info=$infos"
          jq -r '.lints[]? | "[\(.level // "UNKNOWN")] \(.name // "unnamed"): \(.title // .description // "no title")"' performance-advisors.json

          if [ "$errors" -gt 0 ]; then
            echo "::error::Supabase performance advisors contain $errors ERROR finding(s)."
            exit 1
          fi

      - name: Production HTTP signoff
        shell: bash
        run: |
          set -euo pipefail
          for path in / /api/health /api/readiness; do
            body_file="$(mktemp)"
            code="$(curl -sS -L --connect-timeout 10 --max-time 20 -o "$body_file" -w "%{http_code}" "$PRODUCTION_BASE_URL$path")"
            body="$(cat "$body_file")"
            rm -f "$body_file"
            echo "$path -> HTTP $code"
            [ "$code" = "200" ] || exit 1
            if [ "$path" = "/api/readiness" ]; then
              printf '%s' "$body" | jq -e '.ready == true' >/dev/null
            fi
          done

      - name: Upload advisor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-signoff-advisors
          path: |
            security-advisors.json
            performance-advisors.json
          if-no-files-found: ignore
          retention-days: 14
